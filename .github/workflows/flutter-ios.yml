# @polsia:user-owned — compila l'app Flutter di Solco (cartella flutter/, la STESSA di Android, con
# tutte le funzioni) per iOS, su un runner macOS di GitHub. Come per Android qui l'SDK Flutter non c'è
# e le cartelle di piattaforma (ios/) non sono versionate: il workflow le GENERA con `flutter create`,
# le configura (audio in background, nome «Solco») e poi compila e impacchetta.
# Si avvia a mano da Actions → «Flutter (iOS)» → Run workflow, scegliendo la modalità:
#   check         compila per il simulatore (nessun IPA): dimostra che il codice iOS sta in piedi.
#   ipa-unsigned  archivia SENZA firma e pubblica Solco-unsigned.ipa tra gli artefatti: si installa
#                 con AltStore/SideStore, che lo firma sul dispositivo con l'ID Apple dell'utente.
#   ipa-signed    firma ed esporta con la chiave API di App Store Connect (segreti Apple richiesti:
#                 APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, _ISSUER_ID, _PRIVATE_KEY). Senza segreti fallisce.
#   ipa-custom    CERTIFICATO PERSONALIZZATO: compila l'IPA senza firma e lo rifirma con il TUO .p12 + il
#                 .mobileprovision (account Apple o servizio di firma come KravaSign), dai Secrets
#                 IOS_SIGNING_CERT_P12_BASE64, IOS_SIGNING_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64.
#                 Script: flutter/ios-signing/resign-ipa.sh. Guida: flutter/docs/ios-custom-certificate.md.
#   (check esegue anche il selftest della firma personalizzata, con un certificato usa-e-getta.)
#   testflight    compila, firma con la firma automatica di Xcode (chiave API di App Store Connect: crea
#                 da sola certificato di distribuzione e profilo) e CARICA la build su App Store Connect
#                 → TestFlight. Stessi 4 segreti di ipa-signed (APP_STORE_CONNECT_PRIVATE_KEY: il .p8 in
#                 base64 oppure il testo del .p8). Il numero di build è <versionCode del pubspec>.<run>,
#                 così ogni caricamento è unico. Guida: flutter/docs/testflight.md.
# Il repository è pubblico: i minuti macOS sono gratuiti. Nessun avvio automatico.
name: Flutter (iOS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check; ipa-unsigned (AltStore); ipa-signed (chiave API App Store Connect); ipa-manual (.p12 + profilo, ricompila); ipa-custom (rifirma con il tuo .p12 + .mobileprovision, es. KravaSign); testflight (carica su TestFlight)'
        type: choice
        required: true
        default: ipa-unsigned
        options:
          - check
          - ipa-unsigned
          - ipa-signed
          - ipa-manual
          - ipa-custom
          - testflight

permissions:
  contents: read

concurrency:
  group: flutter-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter iOS (${{ inputs.mode }})
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Versioni
        run: flutter --version

      - name: Genera le piattaforme (ios/ + android/) se mancano
        # Generiamo anche android/ perché flutter_launcher_icons, configurato per entrambe le
        # piattaforme nel pubspec, cerca android/app/src/main/AndroidManifest.xml: senza, fallisce.
        # Qui compiliamo solo iOS; la cartella android/ generata resta inerte.
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios,android --org online.solcomusic --project-name solco .
          else
            echo "ios/ già presente: salto."
          fi

      - name: Dipendenze (flutter pub get)
        run: flutter pub get

      - name: Icona dell'app (flutter_launcher_icons)
        run: dart run flutter_launcher_icons

      - name: Configura iOS (audio in background + nome «Solco»)
        run: |
          PLIST=ios/Runner/Info.plist
          # Audio in background (just_audio_background): comandi dalla schermata di blocco e riproduzione
          # a schermo spento. Richiede UIBackgroundModes = audio.
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          # Nome visibile sotto l'icona.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Solco" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Solco" "$PLIST"
          echo "== Info.plist dopo la patch =="
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
          echo "== versione (da pubspec: CFBundleShortVersionString + CFBundleVersion) =="
          grep -nE "^version:" pubspec.yaml || true

      - name: Analisi statica (non blocca la build)
        continue-on-error: true
        run: flutter analyze

      - name: Compila per il simulatore (check)
        if: inputs.mode == 'check'
        run: flutter build ios --simulator --debug

      - name: Selftest della firma personalizzata (certificato e profilo usa-e-getta)
        if: inputs.mode == 'check'
        run: ios-signing/selftest.sh

      - name: Compila l'IPA senza firma
        if: inputs.mode == 'ipa-unsigned' || inputs.mode == 'ipa-custom'
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          rm -rf Payload Solco-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr Solco-unsigned.ipa Payload
          echo "IPA: $(pwd)/Solco-unsigned.ipa ($(du -h Solco-unsigned.ipa | cut -f1))"
          echo "== dentro l'IPA (atteso Payload/Runner.app) =="
          unzip -l Solco-unsigned.ipa | grep -iE "Runner.app/Info.plist|Runner.app/Runner$|Frameworks/" | head

      - name: Firma ed esporta con la chiave API di App Store Connect
        if: inputs.mode == 'ipa-signed'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          for v in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "ERRORE: manca il segreto $v. Imposta i segreti Apple (repo → Settings → Secrets) per la build firmata." >&2
              exit 1
            fi
          done
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 -D > "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          echo "== IPA firmato =="
          ls -la build/ios/ipa/*.ipa || true

      - name: Firma MANUALE (certificato .p12 + profilo dai GitHub Secrets)
        if: inputs.mode == 'ipa-manual'
        env:
          IOS_SIGNING_CERT_P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in IOS_SIGNING_CERT_P12_BASE64 IOS_SIGNING_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then
              echo "ERRORE: manca il segreto $v (repo → Settings → Secrets → Actions)." >&2
              exit 1
            fi
          done
          BUNDLE_ID=online.solcomusic.solco
          KEYCHAIN="$RUNNER_TEMP/solco-sign.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          # Decodifica certificato e profilo dai Secrets (mai stampati).
          echo "$IOS_SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          # Portachiavi temporaneo, usato solo per questa build e poi eliminato.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          # Installa il profilo di provisioning con il suo UUID.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Identità: $IDENTITY"
          echo "Profilo:  $PROFILE_NAME ($UUID)"
          # Opzioni di esportazione Ad Hoc con firma manuale.
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>ad-hoc</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>signingStyle</key><string>manual</string>' \
            "<key>signingCertificate</key><string>${IDENTITY}</string>" \
            '<key>provisioningProfiles</key><dict>' \
            "<key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>" \
            '</dict></dict></plist>' > "$RUNNER_TEMP/ExportOptions.plist"
          # Prepara (pod install + artefatti) senza firma, poi archivia FIRMATO con xcodebuild.
          flutter build ios --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa
          echo "== IPA firmato (manuale, Ad Hoc) =="
          ls -la build/ios/ipa/*.ipa

      - name: Firma con il certificato personalizzato (.p12 + .mobileprovision dai Secrets)
        if: inputs.mode == 'ipa-custom'
        env:
          IOS_SIGNING_CERT_P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for v in IOS_SIGNING_CERT_P12_BASE64 IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!v}" ]; then
              echo "ERRORE: manca il segreto $v (repo → Settings → Secrets → Actions). Guida: flutter/docs/ios-custom-certificate.md" >&2
              exit 1
            fi
          done
          # Decodificati in file temporanei (mai stampati); il runner viene distrutto a fine job.
          printf '%s' "$IOS_SIGNING_CERT_P12_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/custom.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/custom.mobileprovision"
          ios-signing/resign-ipa.sh build/ios/iphoneos/Solco-unsigned.ipa \
            "$RUNNER_TEMP/custom.p12" "$RUNNER_TEMP/custom.mobileprovision" build/ios/ipa/Solco-custom.ipa
          rm -f "$RUNNER_TEMP/custom.p12" "$RUNNER_TEMP/custom.mobileprovision"

      - name: Carica su TestFlight (firma automatica con la chiave API di App Store Connect)
        if: inputs.mode == 'testflight'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "ERRORE: manca un segreto di App Store Connect ($v). Guida: flutter/docs/testflight.md" >&2
              exit 1
            fi
          done
          # Solo valori dal formato atteso: finiscono in argomenti di xcodebuild e in un plist.
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "ERRORE: APPLE_TEAM_ID deve essere di 10 caratteri (A-Z, 0-9)." >&2; exit 1; }
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{8,12}$ ]] || { echo "ERRORE: APP_STORE_CONNECT_KEY_ID non valido." >&2; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "ERRORE: APP_STORE_CONNECT_ISSUER_ID non valido (è un UUID)." >&2; exit 1; }
          KEY_FILE="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          # La chiave .p8: accetta il testo (-----BEGIN PRIVATE KEY-----) oppure il file in base64.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d ' \n\r' | base64 --decode > "$KEY_FILE"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY_FILE" || { echo "ERRORE: APP_STORE_CONNECT_PRIVATE_KEY non è una chiave .p8 valida." >&2; exit 1; }
          chmod 600 "$KEY_FILE"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_FILE"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Numero di build unico per ogni caricamento: <versionCode del pubspec>.<numero dell'esecuzione>.
          VERSION_NAME=$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\1/p' pubspec.yaml)
          VERSION_CODE=$(sed -n 's/^version: *\([0-9.]*\)+\([0-9]*\).*/\2/p' pubspec.yaml)
          BUILD_NUMBER="${VERSION_CODE}.${RUN_NUMBER}"
          echo "Versione ${VERSION_NAME} (build ${BUILD_NUMBER}) → TestFlight"

          # Solo HTTPS standard: esente dalla dichiarazione sulla crittografia (niente domanda a ogni build).
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          # Pod e artefatti Flutter senza firma, poi archivio FIRMATO (firma automatica, team dai Secrets).
          flutter build ios --release --no-codesign --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "${AUTH[@]}" archive | tail -n 40

          # Esporta per App Store Connect e CARICA (destination = upload): finisce in TestFlight.
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            "<key>teamID</key><string>${APPLE_TEAM_ID}</string>" \
            '<key>signingStyle</key><string>automatic</string>' \
            '<key>destination</key><string>upload</string>' \
            '<key>uploadSymbols</key><true/>' \
            '<key>manageAppVersionAndBuildNumber</key><false/>' \
            '</dict></plist>' > "$RUNNER_TEMP/ExportOptions-testflight.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-testflight.plist" \
            -exportPath "$RUNNER_TEMP/testflight-export" "${AUTH[@]}"
          rm -f "$KEY_FILE"
          {
            echo "### Caricato su App Store Connect"
            echo "Solco ${VERSION_NAME} (build ${BUILD_NUMBER}). Apple la elabora in 5–30 minuti, poi compare in"
            echo "App Store Connect → Solco → TestFlight. I tester interni la ricevono senza revisione."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pulizia del portachiavi di firma
        if: always() && inputs.mode == 'ipa-manual'
        run: security delete-keychain "$RUNNER_TEMP/solco-sign.keychain-db" 2>/dev/null || true

      - name: Pubblica l'IPA (e i log) come artefatto
        if: always() && inputs.mode != 'check' && inputs.mode != 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: solco-flutter-ios-${{ inputs.mode }}
          path: |
            flutter/build/ios/iphoneos/Solco-unsigned.ipa
            flutter/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
