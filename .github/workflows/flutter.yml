# @polsia:user-owned — compila e prova l'app Flutter di Solco (cartella flutter/) su un runner Linux
# di GitHub: qui l'SDK Flutter non c'è, e le cartelle di piattaforma (android/) non sono versionate,
# quindi il workflow le GENERA con `flutter create` e poi analizza, prova e impacchetta.
# Si avvia a mano da Actions → «Flutter (Android)» → Run workflow, scegliendo la modalità:
#   check  genera android/, `flutter pub get`, `flutter analyze` e `flutter test` (se ci sono test).
#   aab    come check, poi `flutter build appbundle`. Con i GitHub Secrets del keystore impostati
#          (ANDROID_KEYSTORE_BASE64 = il .jks di upload in base64, ANDROID_KEYSTORE_PASSWORD,
#          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) l'AAB è firmato di RELEASE e pronto per Play;
#          senza quei segreti è firmato di debug (dimostra solo che compila, non si carica su Play).
# Il manifest Android (rete INTERNET + audio in background + nome «Solco») è in flutter/android-config/
# e viene applicato dopo `flutter create`. `analyze` e `test` non bloccano la build.
# Il repository è pubblico: i minuti Linux non costano. Nessun avvio automatico.
name: Flutter (Android)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = analizza e prova; aab = compila anche il bundle Android'
        type: choice
        required: true
        default: aab
        options:
          - check
          - aab

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (per Gradle/Android)
        # AGP 9 (usato da Flutter 3.50) impacchetta un Android Lint che chiama
        # java.util.List.removeLast() — un metodo introdotto in Java 21 (Sequenced
        # Collections, JEP 431). Con JDK 17 il task `lintVitalAnalyzeRelease` va in crash
        # (NoSuchMethodError, bug AGP #522845800) e fa fallire tutta la build di release.
        # JDK 21 risolve: Gradle 9.x di Flutter 3.50 è pienamente compatibile con Java 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # 3.50: target/compileSdk 36 di default (richiesto da Play) e Kotlin DSL + AGP 9;
          # con questo Flutter `in_app_purchase` risolve Play Billing 8/9 (richiesto da Play).
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Versioni
        run: flutter --version

      - name: Genera le piattaforme (android/) se mancano
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org online.solcomusic --project-name solco .
          else
            echo "android/ già presente: salto."
          fi

      - name: Dipendenze (flutter pub get)
        run: flutter pub get

      - name: Icona dell'app (flutter_launcher_icons)
        run: dart run flutter_launcher_icons

      - name: Configura Android (manifest audio/rete + firma di release se i segreti ci sono)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Rete (INTERNET) + audio in background (just_audio_background) + nome app «Solco».
          # Dopo flutter_launcher_icons, così il nostro manifest vince.
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Flutter >= 3.29 genera il Gradle dell'app in Kotlin DSL (build.gradle.kts);
          # individuiamo il file giusto (kts o Groovy) per le patch successive.
          if [ -f android/app/build.gradle.kts ]; then GRADLE_APP=android/app/build.gradle.kts; else GRADLE_APP=android/app/build.gradle; fi
          echo "File Gradle dell'app: $GRADLE_APP"
          # Livelli SDK espliciti: minSdk 24 (Play Protect) + target/compileSdk 36 (richiesto da Play).
          # Flutter 3.50 usa già questi default; forziamo i valori letterali, e interrompiamo se non combaciano.
          sed -i 's/flutter\.minSdkVersion/24/g; s/flutter\.targetSdkVersion/36/g; s/flutter\.compileSdkVersion/36/g' "$GRADLE_APP"
          echo "Livelli SDK dopo la patch:"; grep -nE "minSdk|targetSdk|compileSdk" "$GRADLE_APP" || true
          if ! grep -qE "minSdk[[:space:]]*=?[[:space:]]*24" "$GRADLE_APP" \
            || ! grep -qE "targetSdk[[:space:]]*=?[[:space:]]*36" "$GRADLE_APP" \
            || ! grep -qE "compileSdk[[:space:]]*=?[[:space:]]*36" "$GRADLE_APP"; then
            echo "ERRORE: minSdk 24 / targetSdk 36 / compileSdk 36 non applicati; interrompo." >&2
            exit 1
          fi
          # Firma di release SOLO se il keystore è nei GitHub Secrets; altrimenti build di debug.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "storeFile=$RUNNER_TEMP/upload.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-solco}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } > android/key.properties
            python3 android-config/patch-signing.py "$GRADLE_APP"
            echo "Firma di release configurata (AAB pronto per Play)."
          else
            echo "Nessun keystore nei Secrets: build di DEBUG (dimostra la compilazione, non per Play)."
          fi

      - name: Analisi statica (non blocca la build)
        continue-on-error: true
        run: flutter analyze

      - name: Test Flutter, se presenti (non blocca la build)
        continue-on-error: true
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "Nessuna cartella test/: niente test Flutter da eseguire."
          fi

      - name: Compila il bundle Android (AAB)
        if: inputs.mode == 'aab'
        run: flutter build appbundle --release

      - name: Verifica l'AAB (firma, package, versione)
        if: inputs.mode == 'aab'
        run: |
          AAB=$(ls build/app/outputs/bundle/release/*.aab | head -1)
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"
          echo "== versione dell'app (da pubspec: versionName+versionCode, atteso 0.7.1+10) =="
          grep -nE "^version:" pubspec.yaml || true
          echo "== impronta del certificato di firma (atteso 02:28:46:FD:...:F2:52) =="
          keytool -printcert -jarfile "$AAB" | grep -iE "SHA256:" || echo "(nessuna firma: build di debug)"
          echo "== package e versione (dal manifest) =="
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -iE "online.solcomusic.solco|0\.7\.1" | head -3 || true
          echo "== livelli SDK (attesi minSdk 24, target/compile 36 — richiesti da Play) =="
          if [ -f android/app/build.gradle.kts ]; then GRADLE_APP=android/app/build.gradle.kts; else GRADLE_APP=android/app/build.gradle; fi
          grep -nE "minSdk|targetSdk|compileSdk" "$GRADLE_APP" || true
          echo "== Play Billing Library (via in_app_purchase_android; 0.5.x = Billing >= 8.0.0) =="
          awk '/^  in_app_purchase_android:/{f=1} f&&/version:/{print; f=0}' pubspec.lock || true

      - name: Pubblica l'AAB come artefatto
        if: always() && inputs.mode == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: solco-flutter-aab
          path: flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
