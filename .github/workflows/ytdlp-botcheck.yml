# @polsia:user-owned — misura del controllo anti-bot di YouTube per il worker yt-dlp.
# Il worker (workers/ytdlp-worker, su Render) parte da un IP da datacenter, e YouTube a quegli IP
# risponde «Sign in to confirm you're not a bot». Questo giro misura, da un runner GitHub (anche lui
# un IP da datacenter, ma con accesso a YouTube), che cosa supera il controllo: è il dato su cui è
# costruita la scala di tentativi del worker. Da rifare quando YouTube cambia comportamento.
#
# Che cosa si può misurare (Actions → "Worker yt-dlp: misura anti-bot" → Run workflow):
#   - direct          i client YouTube dall'IP del runner, con e senza PO Token (provider bgutil);
#   - warp            l'uscita da Cloudflare WARP con il client ufficiale, in modalità proxy;
#   - warp_container  se quel client si collega in un container senza privilegi (come su Render);
#   - usque           l'uscita da WARP con il client in spazio utente, nelle sue tre modalità.
# Esito del 20 novembre 2026 (yt-dlp 2026.10.26), riportato nel README del worker: dall'IP del runner
# non passa nessun client, nemmeno con i PO Token; da WARP in modalità proxy sì («l4-socks» di usque
# e client ufficiale), in modalità tunnel no; il client ufficiale non si collega senza privilegi.
# Nessun segreto: richieste anonime a YouTube, niente accesso al worker in produzione. Il collaudo
# dell'immagine vera del worker è in ytdlp-worker.yml.
name: 'Worker yt-dlp: misura anti-bot'

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video da provare'
        type: string
        default: 'https://www.youtube.com/watch?v=hTWKbfoikeg'
      configs:
        description: 'Configurazioni in JSON (vuoto = quelle dello script)'
        type: string
        default: ''
      provider:
        description: 'Provider di PO Token da avviare'
        type: choice
        options: [node, deno, none]
        default: node
      download:
        description: 'Scarica davvero con le configurazioni che passano'
        type: boolean
        default: true
      direct:
        description: "Misura l'uscita diretta del runner"
        type: boolean
        default: true
      warp:
        description: "Misura anche l'uscita da Cloudflare WARP (client ufficiale, modalità proxy)"
        type: boolean
        default: false
      warp_container:
        description: 'Verifica se il client WARP parte in un container senza privilegi (come su Render)'
        type: boolean
        default: false
      usque:
        description: "Misura l'uscita da WARP con usque (client in spazio utente, senza privilegi)"
        type: choice
        options: ['no', l4-socks, socks, socks-http2]
        default: 'no'

permissions:
  contents: read

concurrency:
  group: ytdlp-botcheck
  cancel-in-progress: false

jobs:
  probe:
    name: Misura da un IP da datacenter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scarica lo script e i requisiti del worker
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            workers/ytdlp-worker
          persist-credentials: false

      - name: Prepara Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa yt-dlp come nel worker, più il plugin dei PO Token
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r workers/ytdlp-worker/requirements.txt bgutil-ytdlp-pot-provider==2.0.2
          python -m pip list | grep -i -E 'yt-dlp|bgutil|deno'

      - name: Da dove esce il traffico
        run: curl -fsS -m 15 https://ipinfo.io/json | jq '{org, country, region}' || true

      - name: Avvia il provider di PO Token
        if: inputs.direct && inputs.provider != 'none'
        env:
          FLAVOR: ${{ inputs.provider }}
        run: |
          tag=2.0.2
          if [ "$FLAVOR" = deno ]; then tag=2.0.2-deno; fi
          docker run --name bgutil -d --init -p 127.0.0.1:4416:4416 "brainicism/bgutil-ytdlp-pot-provider:$tag"
          for attempt in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:4416/ping; then echo; break; fi
            sleep 2
          done
          docker stats --no-stream bgutil

      - name: Prova le configurazioni
        if: inputs.direct
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_CONFIGS: ${{ inputs.configs }}
          PROBE_DOWNLOAD: ${{ inputs.download && 'ok' || 'none' }}
        run: python .github/scripts/ytdlp_botcheck.py

      - name: Stato del provider a fine giro
        if: always() && inputs.direct && inputs.provider != 'none'
        run: |
          docker stats --no-stream bgutil || true
          docker logs --tail 80 bgutil 2>&1 | cut -c1-300 || true

      # Cloudflare WARP, client ufficiale per Linux in «modalità proxy»: un SOCKS5 locale da cui il
      # traffico esce dagli IP di Cloudflare invece che da quelli del datacenter.
      - name: Avvia Cloudflare WARP in modalità proxy
        if: inputs.warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl start warp-svc || true
          warp-cli --version
          sleep 3
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
          connected() {
            warp-cli --accept-tos connect || true
            for attempt in $(seq 1 15); do
              if curl -fsS -m 8 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace > trace.txt 2>/dev/null \
                && grep -q 'warp=on' trace.txt; then return 0; fi
              sleep 2
            done
            return 1
          }
          if ! connected; then
            echo "Non connesso con il protocollo predefinito: riprovo con WireGuard"
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos tunnel protocol set WireGuard || true
            connected || true
          fi
          warp-cli --accept-tos status || true
          grep -E '^(warp|colo|loc)=' trace.txt || echo "WARP non attivo"
          curl -fsS -m 15 -x socks5h://127.0.0.1:40000 https://ipinfo.io/json | jq '{org, country, region}' || true

      - name: Prova le configurazioni uscendo da WARP
        if: inputs.warp
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_CONFIGS: ${{ inputs.configs }}
          PROBE_DOWNLOAD: ${{ inputs.download && 'ok' || 'none' }}
          PROBE_PROXY: socks5://127.0.0.1:40000
        run: |
          if ! grep -q 'warp=on' trace.txt 2>/dev/null; then
            echo "WARP non è attivo: misura saltata"; exit 0
          fi
          python .github/scripts/ytdlp_botcheck.py

      # Render non dà privilegi di rete ai container: qui si vede se il client ufficiale, in modalità
      # proxy, parte lo stesso in un container Docker normale (nessuna capability aggiunta).
      - name: Il client WARP parte in un container senza privilegi?
        if: inputs.warp_container
        run: |
          docker run --rm debian:bookworm-slim bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq curl gnupg ca-certificates >/dev/null
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ bookworm main" > /etc/apt/sources.list.d/cloudflare-client.list
            apt-get update -qq
            apt-get install -y -qq cloudflare-warp >/dev/null
            set +e
            (warp-svc --accept-tos > /tmp/warp-svc.log 2>&1 &)
            sleep 5
            warp-cli --accept-tos registration new || warp-cli --accept-tos register
            warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy
            warp-cli --accept-tos connect
            for attempt in $(seq 1 15); do
              if curl -fsS -m 8 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E "^(warp|colo)="; then break; fi
              sleep 2
            done
            warp-cli --accept-tos status
            echo "--- memoria di warp-svc"
            for process in /proc/[0-9]*; do
              if grep -q warp-svc "$process/comm" 2>/dev/null; then grep VmRSS "$process/status"; fi
            done
            echo "--- ultime righe di warp-svc"; tail -n 25 /tmp/warp-svc.log | cut -c1-240
          ' || true

      # usque: client WARP open-source che gira tutto in spazio utente, quindi senza privilegi di
      # rete (il client ufficiale, misurato qui sopra, in un container normale non si collega).
      # Compilato dal commit della versione 4.2.1, eseguito come utente «nobody» e senza variabili
      # d'ambiente: è così che il worker lo terrebbe lontano dalle proprie chiavi.
      - name: Prepara Go
        if: inputs.usque != 'no'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Compila usque dal commit fissato
        if: inputs.usque != 'no'
        run: |
          git clone -q https://github.com/Diniboy1123/usque.git /tmp/usque-src
          cd /tmp/usque-src
          git checkout -q 6aa03fc97d12848dce34eedbd187fb1077b5d1ea
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/usque .
          ls -l /tmp/usque
          sha256sum /tmp/usque

      - name: Registra e avvia usque
        if: inputs.usque != 'no'
        env:
          MODE: ${{ inputs.usque }}
        run: |
          sudo install -d -o nobody -g nogroup -m 700 /tmp/warp
          run() { sudo -u nobody env -i HOME=/tmp/warp PATH=/usr/bin:/bin "$@"; }
          case "$MODE" in
            l4-socks) args="l4-socks -b 127.0.0.1 -p 40001 --system-dns" ;;
            socks) args="socks -b 127.0.0.1 -p 40001" ;;
            socks-http2) args="socks -b 127.0.0.1 -p 40001 --http2" ;;
          esac
          register() {
            sudo rm -f /tmp/warp/config.json
            run /tmp/usque -c /tmp/warp/config.json register -a -n solco-ci 2>&1 | sed -E 's#[A-Za-z0-9+/=_-]{24,}#[…]#g' | tail -n 2
          }
          launch() {
            sudo pkill -x usque || true
            sleep 1
            run sh -c "cd /tmp/warp && /tmp/usque -c config.json $args > usque.log 2>&1 &"
            for attempt in $(seq 1 20); do
              if curl -fsS -m 8 -x socks5://127.0.0.1:40001 https://www.cloudflare.com/cdn-cgi/trace > trace-usque.txt 2>/dev/null \
                && grep -q 'warp=on' trace-usque.txt; then break; fi
              sleep 1
            done
          }
          # Da quale indirizzo esce ogni connessione (quante volte ciascuno). YouTube lega la sessione e
          # il link del media all'IP: conta sapere se l'uscita è la stessa per tutta la sessione, e se
          # cambia riavviando il client o registrando un dispositivo nuovo.
          addresses() {
            for attempt in $(seq 1 "$1"); do
              curl -fsS -m 8 -x socks5://127.0.0.1:40001 https://checkip.amazonaws.com || echo "nessuna risposta"
            done | sort | uniq -c
          }
          started=$(date +%s)
          register
          launch
          echo "pronto dopo $(( $(date +%s) - started ))s"
          grep -E '^(warp|colo|loc)=' trace-usque.txt || echo "WARP non attivo"
          echo "--- 8 connessioni consecutive"; addresses 8
          echo "--- dopo il riavvio del client, stessa registrazione"; launch; addresses 4
          echo "--- dopo una registrazione nuova"; register; launch; addresses 4
          echo "--- dopo un'altra registrazione nuova"; register; launch; addresses 4
          grep -E '^(warp|colo)=' trace-usque.txt || echo "WARP non attivo"
          sudo tail -n 6 /tmp/warp/usque.log | cut -c1-220

      - name: Prova le configurazioni uscendo da usque
        if: inputs.usque != 'no'
        env:
          PROBE_URL: ${{ inputs.url }}
          PROBE_CONFIGS: ${{ inputs.configs }}
          PROBE_DOWNLOAD: ${{ inputs.download && 'ok' || 'none' }}
          PROBE_PROXY: socks5://127.0.0.1:40001
        run: |
          if ! grep -q 'warp=on' trace-usque.txt 2>/dev/null; then
            echo "WARP non è attivo: misura saltata"; exit 0
          fi
          python .github/scripts/ytdlp_botcheck.py
          echo "--- memoria di usque (attuale e di picco)"
          for process in /proc/[0-9]*; do
            if sudo grep -q '^usque$' "$process/comm" 2>/dev/null; then sudo grep -E 'VmRSS|VmHWM' "$process/status"; fi
          done
          sudo tail -n 12 /tmp/warp/usque.log | cut -c1-220
