# @polsia:user-owned — tiene sveglio il worker yt-dlp (su Render, piano gratuito). Ogni pochi minuti
# chiama il suo /health PUBBLICO (nessuna chiave, nessun segreto) così il servizio non va in pausa dopo
# ~15 minuti di inattività e il bot Telegram /video non deve svegliarlo al primo uso (il messaggio
# "il servizio di download si stava avviando dopo una pausa … riprova fra 30 secondi").
#
# L'URL si legge dalla VARIABILE di repo YTDLP_SERVICE_URL (lo stesso valore di env su Vercel):
#   repo → Settings → Secrets and variables → Actions → Variables → New variable
#   nome: YTDLP_SERVICE_URL   valore: https://<tuo-worker>.onrender.com
# Se la variabile manca, il workflow non fa nulla (nessun errore).
#
# Il cron di GitHub può ritardare di qualche minuto: */5 lascia margine sotto la pausa dei 15 minuti.
# I giri programmati partono SOLO dal branch predefinito (claude/new-session-e8afhd), una volta unito.
# Non fallisce mai (esce 0): è un keep-warm, non un monitoraggio — gli allarmi di salute restano al
# "Monitoraggio Solco". Tenere un servizio Render gratuito sempre sveglio consuma quasi tutte le ~750
# ore gratuite al mese: va bene se yt-dlp è l'unico servizio Render.
name: 'Worker yt-dlp: tienilo sveglio'

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ytdlp-keepwarm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /health del worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Svegliare il worker (GET /health)
        env:
          URL: ${{ vars.YTDLP_SERVICE_URL }}
        run: |
          if [ -z "${URL:-}" ]; then
            echo "YTDLP_SERVICE_URL non impostata (repo → Settings → Secrets and variables → Actions → Variables): niente da svegliare."
            exit 0
          fi
          base="${URL%/}"
          echo "Ping $base/health"
          for attempt in 1 2 3; do
            code=$(curl -fsS -m 30 -o /dev/null -w '%{http_code}' "$base/health" 2>/dev/null || echo 000)
            echo "tentativo $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "worker sveglio."
              exit 0
            fi
            sleep 15
          done
          echo "nota: /health non ha risposto 200 (il worker potrebbe essersi appena svegliato o essere giù); il keep-warm non lo considera un errore."
          exit 0
