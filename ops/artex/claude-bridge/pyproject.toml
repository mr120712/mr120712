# @polsia:user-owned — ARTEX ↔ Claude Agent SDK HTTP bridge.
# Serves an Anthropic Messages API-compatible endpoint whose backend is the
# Claude Agent SDK (subscription-backed), so ARTEX can plan tasks against
# the user's Claude Code login instead of a pay-per-token API key.
[project]
name = "artex-claude-bridge"
version = "0.1.0"
description = "Anthropic Messages API shim backed by the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "claude-agent-sdk>=0.1.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "respx>=0.21",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `integration` tests spawn the real `claude` CLI and consume subscription
# quota; excluded by default. Run them with `pytest -m integration` and
# `ARTEX_BRIDGE_LIVE_TESTS=1`.
addopts = "-ra -q -m 'not integration'"
pythonpath = ["src"]
markers = [
  "integration: live tests that spawn the real `claude` CLI and hit the user's Claude Code subscription",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
