# ops/artex/docker-compose.yml — a locked-down ARTEX stack for the VPS.
#
# Differences from the upstream compose file:
#   • ARTEX_BIND_ADDR defaults to 127.0.0.1 (never a public interface).
#   • Budgets and quiet noise profile are on by default via .env.example.
#   • Postgres is published only on the Docker network — no host port.
#   • A read-only mount for scope.json: the bootstrap imports it once; the UI
#     cannot write it back.
#
# Built from the ARTEX source checkout that bootstrap.sh pulls at a pinned tag.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Postgres is reachable only on the compose network; nothing on the host.

  artex:
    build:
      # bootstrap.sh clones ARTEX into ./artex-src next to this file.
      context: ./artex-src
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-pinned}
    image: artex:solco-staging
    # Override the Dockerfile's default CMD. The baseline bound to :8787
    # which should be all-interfaces, but on this host the binary was
    # resolving to loopback-only, blocking the gateway container from
    # reaching artex:8787. Force bind-all explicitly here; the host-side
    # port mapping below still keeps localhost-only external exposure.
    command: ["-addr", "0.0.0.0:8787", "-proxy", "0.0.0.0:8788"]
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ARTEX v0.7.0 reads only ARTEX_PG_DSN from env (component ARTEX_PG_HOST/
      # USER/PASSWORD/DBNAME vars landed on main, post-release). Build the DSN
      # inline from the Postgres credentials. The password must be URL-safe
      # (no / ? % @ : # or space); bootstrap.sh generates a random URL-safe
      # password by default, so this is fine. If a human-typed password trips
      # it, either regenerate with bootstrap.sh --reset-pass or URL-encode here.
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      # Component vars are still passed for forward compatibility with ARTEX
      # releases that read them. On v0.7.0 they're a no-op.
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD}
      ARTEX_PG_DBNAME: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      # When ARTEX_USE_CLAUDE_BRIDGE=1 we route the planner through the local
      # subscription-backed bridge sibling (see the `claude-bridge` service
      # below) instead of pay-per-token Anthropic/OpenAI. The bridge speaks
      # Anthropic's /v1/messages shape with x-api-key auth; ARTEX treats this
      # exactly like the real API. Set ARTEX_USE_CLAUDE_BRIDGE=0 (or unset) to
      # go back to a direct Anthropic/OpenAI call.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dummy-bridge-key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-anthropic}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-claude-opus-4-7}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-http://claude-bridge:5000}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # Bridge supports both streaming and non-streaming. Default is non-stream
      # for first debug; flip to true for SSE.
      ARTEX_LLM_STREAM: ${ARTEX_LLM_STREAM:-false}
      # ARTEX's /api/llm/models endpoint refuses LLM URLs that resolve to
      # private / loopback addresses unless the exact host:port is listed
      # here. The claude-bridge sibling lives on the internal compose network
      # (an RFC1918 address), so we whitelist it once; without this the UI
      # replies "endpoint URL host is not allowed" when you try to save a
      # profile pointing at http://claude-bridge:5000.
      ARTEX_LLM_PRIVATE_ENDPOINTS: ${ARTEX_LLM_PRIVATE_ENDPOINTS:-claude-bridge:5000}
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:-}
      ARTEX_TRUSTED_PROXIES: ${ARTEX_TRUSTED_PROXIES:-}
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_UPDATE_CHECK: ${ARTEX_UPDATE_CHECK:-}
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-quiet}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
      # Budgets: ARTEX treats any <= 0 value as Unlimited (agent/budget.go
      # budgetCap -> math.MaxInt64). When both task and intent are (0,0) the
      # whole BudgetLedger is nil -- no in-flight accounting at all. We route
      # through the Claude Code subscription bridge (not pay-per-token), so
      # the real ceiling is the subscription rate window, not a per-task cap;
      # ARTEX just sees 429s and backs off. Set to 0 to disable. Raise only
      # if you have a concrete reason (e.g. hard spend cap on a direct
      # Anthropic/OpenAI key).
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-0}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-0}
      ARTEX_INTENT_BUDGET_TOKENS: ${ARTEX_INTENT_BUDGET_TOKENS:-0}
      ARTEX_INTENT_BUDGET_TURNS: ${ARTEX_INTENT_BUDGET_TURNS:-0}
      # The one target the operator confirmed at bootstrap. Used by the import
      # script to render scope.json; ARTEX itself reads scope from the DB.
      ARTEX_TARGET_HOST: ${ARTEX_TARGET_HOST:?set ARTEX_TARGET_HOST in .env}
    ports:
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      # MITM proxy also loopback; needed only if you point a browser at it.
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./scope.json:/app/scope.json:ro
      # config.json carries the DB section; bootstrap.sh writes it from .env.
      # Read-only inside the container so ARTEX can't rewrite it.
      - ./config.json:/app/config.json:ro
    restart: unless-stopped

  claude-bridge:
    # ARTEX ↔ Claude Agent SDK bridge. Speaks Anthropic's /v1/messages shape;
    # backend is the Claude Code CLI driven by the user's subscription (not a
    # pay-per-token API key). Localhost only — never exposed on the public
    # interface. See ./claude-bridge/README.md for first-boot `claude login`
    # steps and the rate-limit knobs.
    build:
      context: ./claude-bridge
    image: artex-claude-bridge:solco-staging
    security_opt:
      - "no-new-privileges:true"
    environment:
      BRIDGE_PORT: "5000"
      BRIDGE_HOST: "0.0.0.0"
      # Serialized + slow by default: the limiter now BLOCKS (waits) instead
      # of refusing a 429 to ARTEX, so the sub window never gets hammered.
      # 0.5 rps = ~one call every 2s; 1 in-flight = strictly serial.
      BRIDGE_MAX_RPS: ${BRIDGE_MAX_RPS:-0.5}
      BRIDGE_MAX_CONCURRENCY: ${BRIDGE_MAX_CONCURRENCY:-1}
      # Upstream (subscription) rate-limit retry policy. On a real 429 from
      # Claude Code, the bridge retries with exponential backoff instead of
      # surfacing the 429 to ARTEX. attempts=10, base=5s, cap=60s ->
      # up to ~5 min of retries riding out a typical cooldown.
      BRIDGE_UPSTREAM_RETRY_ATTEMPTS: ${BRIDGE_UPSTREAM_RETRY_ATTEMPTS:-10}
      BRIDGE_UPSTREAM_RETRY_BASE_SECONDS: ${BRIDGE_UPSTREAM_RETRY_BASE_SECONDS:-5}
      BRIDGE_UPSTREAM_RETRY_CAP_SECONDS: ${BRIDGE_UPSTREAM_RETRY_CAP_SECONDS:-60}
      # When the SDK gives us a resets_at (the Unix timestamp the subscription
      # window opens again — e.g. five_hour), the bridge waits until that
      # instant instead of guessing with exp backoff. This caps a SINGLE such
      # wait: a reset further than this (e.g. seven_day) falls back to exp
      # backoff instead of hanging the request for a week. Default 6h =
      # rides out a five_hour window fully.
      BRIDGE_RESET_WAIT_CAP_SECONDS: ${BRIDGE_RESET_WAIT_CAP_SECONDS:-21600}
      # Optional paid-API bypass. When set, at the first SubscriptionRateLimited
      # the bridge hops to api.anthropic.com DIRECTLY with this key instead of
      # waiting for the sub window to reset. Pay-per-token on this key; the
      # task never blocks. Unset (default) = behavior is wait-until-reset.
      # The key only lives in process env; it never appears in logs.
      ANTHROPIC_FALLBACK_API_KEY: ${ANTHROPIC_FALLBACK_API_KEY:-}
      ANTHROPIC_FALLBACK_BASE_URL: ${ANTHROPIC_FALLBACK_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_FALLBACK_TIMEOUT_SECONDS: ${ANTHROPIC_FALLBACK_TIMEOUT_SECONDS:-300}
      BRIDGE_CACHE_TTL_SECONDS: ${BRIDGE_CACHE_TTL_SECONDS:-3600}
      BRIDGE_CACHE_PATH: /data/cache.sqlite
      BRIDGE_LOG_LEVEL: ${BRIDGE_LOG_LEVEL:-INFO}
    ports:
      # Localhost only so you can probe /health from the host but nothing on
      # the public network can hit it.
      - "127.0.0.1:5057:5000"
    volumes:
      # Persistent cache + logs.
      - ./claude-bridge-data:/data
      # Claude Code auth. Run `claude login` INSIDE the container once:
      #   docker compose exec claude-bridge claude login
      # The bridge now runs as uid 10100 (Claude Code CLI refuses
      # --dangerously-skip-permissions when running as root), so credentials
      # live under /home/bridge/.claude, not /root/.claude.
      - ./claude-bridge-auth:/home/bridge/.claude
    restart: unless-stopped

  gateway:
    # Better Auth magic-link gateway in front of ARTEX. Caddy terminates TLS and
    # forwards every request here; we authenticate it (one-email allowlist, no
    # sign-up) and only then rewrite to the ARTEX container. See
    # ./gateway/README.md for setup and the env vars below.
    build:
      context: ./gateway
    image: artex-gateway:solco-staging
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      - artex
    environment:
      DATABASE_URL: file:/data/gateway.db
      GATEWAY_URL: https://${ARTEX_PUBLIC_HOST:?set ARTEX_PUBLIC_HOST in .env}
      BETTER_AUTH_SECRET: ${GATEWAY_BETTER_AUTH_SECRET:?set GATEWAY_BETTER_AUTH_SECRET in .env (openssl rand -hex 32)}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?set GATEWAY_ADMIN_USERNAME in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?set GATEWAY_ADMIN_PASSWORD in .env}
      ARTEX_UPSTREAM_URL: http://artex:8787
      # The ARTEX admin password (the one chosen on /setup). The gateway uses
      # it to auto-login into ARTEX for the single authenticated user so the
      # ARTEX /login screen is never shown. Rotate both at the same time.
      ARTEX_SESSION_PASSWORD: ${ARTEX_SESSION_PASSWORD:?set ARTEX_SESSION_PASSWORD in .env (matches the password you set on /setup)}
    ports:
      # Localhost only — the gateway is not public; Caddy fronts it.
      - "127.0.0.1:3030:3000"
    volumes:
      # SQLite auth DB — survives container rebuilds. Not committed to the
      # repo (ops/artex/gateway/data/ is gitignored except for .gitkeep).
      - ./gateway/data:/data
    restart: unless-stopped

  caddy:
    # Public-facing TLS reverse proxy. Fetches a free Let's Encrypt cert for
    # the ARTEX_PUBLIC_HOST (A record on Vercel DNS → this VPS) and reverse
    # proxies to the gateway. The gateway enforces Better Auth magic-link
    # before forwarding to ARTEX; Caddy adds only TLS and reachability.
    image: caddy:2-alpine
    container_name: artex-caddy
    depends_on:
      - gateway
    environment:
      ARTEX_PUBLIC_HOST: ${ARTEX_PUBLIC_HOST:?set ARTEX_PUBLIC_HOST in .env}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
