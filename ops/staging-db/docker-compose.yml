# ops/staging-db/docker-compose.yml — Solco staging Postgres on the Hetzner VPS.
#
# Separate from the ARTEX stack: different docker network, different container,
# different volume. ARTEX writes test payloads here; a compromise cannot pivot
# into ARTEX, and vice versa.
#
# TLS is enforced by the mounted pg_hba.conf (only hostssl lines accept remote
# connections). The server cert + key are generated by bootstrap.sh into ./tls
# and mounted read-only; they're owned by the postgres user inside the image
# (uid 70 on alpine) because bootstrap.sh chowns them that way.

services:
  postgres:
    image: postgres:16-alpine
    container_name: solco-staging-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solco_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solco_staging}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tls:/etc/postgresql/tls:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      # Public on port 5433 (not the default 5432). TLS + the random password
      # are what protect it; Hetzner Cloud firewall allows 5433 from 0.0.0.0/0.
      - "0.0.0.0:5433:5432"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      # Light tuning for a small VPS; tune higher if the build fails during
      # prisma db push with timeout errors.
      - shared_buffers=256MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solco_staging} -d ${POSTGRES_DB:-solco_staging}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"

volumes:
  pgdata:
