# ops/staging-db/pg_hba.conf — authentication policy for the Solco staging DB.
#
# The order of rules matters; Postgres uses the FIRST matching row and stops.
# TLS from remote hosts is the only accepted shape; a cleartext attempt from
# the internet is rejected before Postgres even reads the password.
#
# TYPE      DATABASE        USER            ADDRESS                 METHOD
local       all             all                                     trust
host        all             all             127.0.0.1/32            scram-sha-256
host        all             all             ::1/128                 scram-sha-256

# Reject any cleartext connection from the outside before considering TLS,
# so a non-TLS client can't even send its password.
hostnossl   all             all             0.0.0.0/0               reject
hostnossl   all             all             ::/0                    reject

# TLS from the internet: strong password, scram-sha-256.
hostssl     all             all             0.0.0.0/0               scram-sha-256
hostssl     all             all             ::/0                    scram-sha-256
