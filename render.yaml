# Render Blueprint — Solco yt-dlp worker (Docker service, code in workers/ytdlp-worker/).
#
# WHY this file: a web service created as runtime "node" at the repo root builds the Next.js app,
# NOT the worker. The fix is a DOCKER service rooted at workers/ytdlp-worker. Render can't convert a
# node service to docker in place, so recreate it from this Blueprint.
#
# Use (Render dashboard):
#   1) Delete the old mis-created service (the "node" one) so its name frees up.
#   2) New → Blueprint → pick this repo → Apply. Render reads this file.
#   3) When prompted, set WORKER_API_KEY (the SAME value as YTDLP_SERVICE_KEY on Vercel).
#   4) Health goes green at /health → {"ok":true,"mode":"serve"}. Tell Claude the URL to wire Vercel.
services:
  - type: web
    name: s2a76b51c9520ac
    runtime: docker
    repo: https://github.com/mr120712/mr120712
    rootDir: workers/ytdlp-worker        # the key fix — build the worker's Dockerfile, not the repo root
    region: ohio
    plan: free                           # free SPINS DOWN (cold start can exceed the bot's 40s);
                                         # use "starter" for an always-on worker (recommended)
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WORKER_MODE
        value: serve
      - key: WORKER_API_KEY
        sync: false                      # secret — set it in the dashboard (= YTDLP_SERVICE_KEY on Vercel)
      # Optional, only if YouTube blocks the datacenter IP ("Sign in to confirm you're not a bot").
      # The worker detects it and GET /antibot tells you if it passes; these are the fixes when it
      # doesn't (see workers/ytdlp-worker/README.md), from the least to the most demanding.
      # Free exit through Cloudflare WARP — measured as the one free lever that gets past the check
      # from a datacenter IP. It is opt-in because enabling it accepts Cloudflare's WARP terms (the
      # client is "usque", open source and unofficial): turned on at the owner's request. Remove the
      # entry to turn it off. GET /health → antibot.warp shows whether the tunnel is up; it needs
      # outbound UDP.
      - key: YTDLP_WARP
        value: "1"
      # Cookies: easiest is Dashboard → Environment → Secret Files → a file named cookies.txt
      # (mounted at /etc/secrets/cookies.txt, picked up automatically). Or as a variable:
      # - key: YTDLP_COOKIES
      #   sync: false
      # Proxy (residential/mobile — datacenter proxies get the same bot check). Paste it the way the
      # provider hands it out: http://user:pass@host:port, host:port:user:pass or user:pass:host:port.
      # GET /health → antibot.proxy_info shows whether it was read (never the host or the credentials).
      # - key: YTDLP_PROXY
      #   sync: false

  # ── Solco AI performance agents (code in workers/ai-agents/) ─────────────────────────────────────
  # A Render CRON JOB: no public port, nothing to attack from the internet; it only makes outbound
  # calls. Every Monday it measures the live site (pages, JS/CSS, APIs, this yt-dlp worker's /health),
  # runs 7 specialist agents + 1 lead agent and prints the report (Logs), optionally to Telegram.
  # AI backends, in order (policy in lib.mjs: anything else is refused, so keys never leave them):
  #   0) MagnetAPI https://api.magnetapi.org/v1 (MAGNETAPI_API_KEY), the most capable model it lists;
  #   1) MWAPI https://api.mwapi.dev/v1, key 1 then key 2 (MWAPI_API_KEY, MWAPI_API_KEY_2);
  #   2) your PRIVATE FreeLLMAPI on Render's private network (FREELLMAPI_PRIVATE_URL, see below);
  #   3) Solco's reserve https://www.solcomusic.online/api/ai-reserve/v1 (SOLCO_RESERVE_KEY).
  # Cron jobs are not on Render's free plan: "starter" is billed by the minutes it actually runs.
  # The build runs the tests, so a broken worker never replaces a working one.
  - type: cron
    name: solco-ai-agents
    runtime: node
    rootDir: workers/ai-agents
    region: ohio
    plan: starter
    schedule: "23 5 * * 1"               # Mondays 05:23 UTC; "Trigger Run" in the dashboard runs it now
    buildCommand: node --test agents.test.mjs
    startCommand: node agents.mjs
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MAGNETAPI_API_KEY           # MagnetAPI key (agents only; tried first)
        sync: false
      - key: MAGNETAPI_MODEL             # optional: a MagnetAPI model id; empty = the best it lists
        sync: false
      - key: MWAPI_API_KEY               # your first MWAPI key
        sync: false
      - key: MWAPI_API_KEY_2             # your second MWAPI key (used when the first is limited)
        sync: false
      - key: MWAPI_MODEL                 # Claude via MWAPI; "auto" = pick from /models
        value: claude-sonnet-5
      - key: SOLCO_RESERVE_KEY           # = FREELLMAPI_API_KEY on Vercel (the reserve's Bearer)
        sync: false
      - key: FREELLMAPI_PRIVATE_URL      # e.g. http://freellmapi:3001/v1 (Render private network only)
        sync: false
      - key: FREELLMAPI_PRIVATE_KEY      # the API key your FreeLLMAPI instance gives its clients
        sync: false
      - key: TELEGRAM_BOT_TOKEN          # optional: send the report to Telegram
        sync: false
      - key: TELEGRAM_CHAT_ID            # optional: your chat id (the one in SKYNET_TELEGRAM_CHAT_IDS)
        sync: false

  # ── Your FreeLLMAPI, PRIVATE (uses your license key) ─────────────────────────────────────────────
  # Uncomment after filling in the image and the license variable name from FreeLLMAPI's install
  # guide (not guessed here). A private service ("pserv") has NO public URL: only your other Render
  # services in the same region reach it, at http://freellmapi:3001/v1.
  # - type: pserv
  #   name: freellmapi
  #   runtime: image
  #   image:
  #     url: <FreeLLMAPI Docker image from its install guide>
  #   region: ohio
  #   plan: starter
  #   envVars:
  #     - key: PORT
  #       value: "3001"
  #     - key: <FreeLLMAPI license variable name>
  #       sync: false                    # your license key: set it in the dashboard, never in Git
